<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>별빛 탄막</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;font-family:"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#000;box-shadow:0 0 50px #3a2a8a66;border-radius:4px}
  #btns{position:fixed;left:0;right:0;bottom:14px;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
  #btns button{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:2px solid #ffffff66;
    background:#ffffff1a;color:#fff;font-size:15px;font-weight:700;backdrop-filter:blur(4px)}
  #btns button.on{background:#ff4d6d88;border-color:#ff9db0}
  #restart{position:fixed;top:10px;right:10px;display:none;padding:8px 14px;border-radius:20px;
    border:2px solid #ffffff66;background:#00000088;color:#fff;font-size:14px;font-weight:700;
    font-family:inherit;cursor:pointer;z-index:10}
  #restart:hover{background:#ff4d6d99;border-color:#ff9db0}
  @media (pointer:coarse){#btns{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="restart" title="재시작 (R)">↻ 재시작</button>
<div id="btns">
  <button id="bFocus">집중</button>
  <button id="bBomb">폭탄</button>
</div>

<script>
(()=>{
'use strict';
const W=480,H=640,PI=Math.PI,TAU=PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',resize);resize();

const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const FONT='"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif';

/* ---------- 사운드 ---------- */
let AC=null,muted=false;
function snd(f,d,type='square',v=0.03,slide=0){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- 탄 스프라이트 ---------- */
function mkSpr(col,r){
  const pad=7,s=(r+pad)*2,c=document.createElement('canvas');
  c.width=c.height=s*2;const g=c.getContext('2d');g.scale(2,2);
  const cx=s/2,gr=g.createRadialGradient(cx,cx,r*.5,cx,cx,r+pad);
  gr.addColorStop(0,col+'aa');gr.addColorStop(1,col+'00');
  g.fillStyle=gr;g.beginPath();g.arc(cx,cx,r+pad,0,TAU);g.fill();
  g.fillStyle=col;g.beginPath();g.arc(cx,cx,r,0,TAU);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(cx,cx,r*.55,0,TAU);g.fill();
  return{c,s,h:s/2,r};
}
const KINDS={a:mkSpr('#ff4d6d',4),b:mkSpr('#ffd34d',5),c:mkSpr('#4dd2ff',7),d:mkSpr('#c77dff',11)};

/* ---------- 상태 ---------- */
let state='title',paused=false;
let p,pb,eb_,enemies,items,parts,boss,spawnQ;
let score,hi=0,graze,level,stageT,spawnT,qT,warn,warnT,banner,bombT,bombFx,diffSpd,d,shake,gT=0;
try{hi=+localStorage.getItem('tanmak_hi')||0;}catch(e){}

const stars=[];for(let i=0;i<90;i++)stars.push({x:rnd(0,W),y:rnd(0,H),z:rnd(.3,1.6)});

function startGame(){
  p={x:W/2,y:H-90,lives:3,bombs:3,power:0,inv:2,fire:0};
  pb=[];eb_=[];enemies=[];items=[];parts=[];boss=null;spawnQ=[];
  score=0;graze=0;level=1;d=0;diffSpd=1;stageT=0;spawnT=1;qT=0;warn=false;warnT=0;
  bombT=0;bombFx=null;shake=0;
  banner={text:'STAGE 1',t:2,col:'#9ad0ff'};
  state='play';paused=false;
  document.getElementById('restart').style.display='block';
  snd(440,.25,'triangle',.05,440);
}
function endGame(){
  state='over';
  if(score>hi){hi=score;try{localStorage.setItem('tanmak_hi',hi);}catch(e){}}
}

/* ---------- 입력 ---------- */
const keys={};let touchFocus=false;
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;if(e.repeat)return;onKey(e.code);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
function onKey(c){
  if(c==='KeyM'){muted=!muted;return;}
  if(c==='KeyR'&&state!=='title'){startGame();return;}
  if(state!=='play'){if(c==='Enter'||c==='Space'||c==='KeyZ')startGame();return;}
  if(c==='KeyP'||c==='Escape'){paused=!paused;return;}
  if(paused)return;
  if(c==='KeyX'||c==='Space')bomb();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true;});

let drag=null;
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'){startGame();return;}
  if(paused){paused=false;return;}
  drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!drag||state!=='play'||paused)return;
  const k=W/cv.getBoundingClientRect().width;
  p.x+=(e.clientX-drag.x)*k*(touchFocus?.5:1.15);
  p.y+=(e.clientY-drag.y)*k*(touchFocus?.5:1.15);
  clampP();drag={x:e.clientX,y:e.clientY};
});
const endDrag=()=>{drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
const rb=document.getElementById('restart');
rb.addEventListener('click',()=>{rb.blur();startGame();});
const bF=document.getElementById('bFocus'),bB=document.getElementById('bBomb');
bF.addEventListener('pointerdown',e=>{e.stopPropagation();touchFocus=!touchFocus;bF.classList.toggle('on',touchFocus);});
bB.addEventListener('pointerdown',e=>{e.stopPropagation();if(state==='play'&&!paused)bomb();});
function clampP(){p.x=Math.max(12,Math.min(W-12,p.x));p.y=Math.max(16,Math.min(H-16,p.y));}

/* ---------- 탄/이펙트 ---------- */
function eb(x,y,ang,sp,kind){
  if(eb_.length>2000)return;
  const k=KINDS[kind],s=sp*diffSpd;
  eb_.push({x,y,vx:Math.cos(ang)*s,vy:Math.sin(ang)*s,r:k.r,spr:k,g:false});
}
const aim=(x,y)=>Math.atan2(p.y-y,p.x-x);
function burst(x,y,col,n,sp=140,life=.6,size=3){
  for(let i=0;i<n&&parts.length<700;i++){
    const a=rnd(0,TAU),s=rnd(.2,1)*sp;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,col,size:rnd(size*.6,size*1.4)});
  }
}
function dropItem(x,y,type){items.push({x,y,vy:-130,type});}
function showBanner(text,t,col){banner={text,t,col};}

/* ---------- 적 ---------- */
function fairy(x,y){return{x,y,sx:x,hp:4+d*1.5,r:13,t:0,cd:.6+Math.random(),col:'#7dffb0',sc:100,
  upd(dt){this.t+=dt;this.y+=80*dt;this.x=this.sx+Math.sin(this.t*2.2)*45;this.cd-=dt;
    if(this.cd<=0&&this.y>20&&this.y<H-220){this.cd=1.5;const a=aim(this.x,this.y);for(const o of[-.28,0,.28])eb(this.x,this.y,a+o,150,'a');}
    if(this.y>H+30)this.dead=true;}};}
function wing(dir,y){return{x:dir>0?-20:W+20,y,hp:3+d,r:11,t:0,cd:.3,vx:dir*130,col:'#ffb86b',sc:80,
  upd(dt){this.t+=dt;this.x+=this.vx*dt;this.y+=22*dt;this.cd-=dt;
    if(this.cd<=0&&this.x>20&&this.x<W-20){this.cd=.55;eb(this.x,this.y,aim(this.x,this.y),170,'b');}
    if(this.x<-40||this.x>W+40)this.dead=true;}};}
function spinner(x){return{x,y:-30,hp:16+d*2,r:16,t:0,cd:0,ang:rnd(0,TAU),col:'#ff8fd0',sc:300,
  upd(dt){this.t+=dt;
    if(this.t<=9){if(this.y<120)this.y+=100*dt;}else this.y-=90*dt;
    this.cd-=dt;
    if(this.cd<=0&&this.y>=115&&this.t<=9){this.cd=.13;this.ang+=.45;eb(this.x,this.y,this.ang,115,'b');eb(this.x,this.y,this.ang+PI,115,'b');}
    if(this.y<-40)this.dead=true;}};}
function ringE(x){return{x,y:-30,ty:rnd(90,150),hp:22+d*3,r:19,t:0,cd:1,col:'#6bd0ff',sc:400,
  upd(dt){this.t+=dt;
    if(this.t<=10){if(this.y<this.ty)this.y+=90*dt;}else this.y-=90*dt;
    this.cd-=dt;
    if(this.cd<=0&&this.y>=this.ty-5&&this.t<=10){this.cd=1.9;
      const n=Math.min(28,16+d*2),off=rnd(0,TAU);
      for(let i=0;i<n;i++)eb(this.x,this.y,off+i/n*TAU,95,'c');
      eb(this.x,this.y,aim(this.x,this.y),160,'a');}
    if(this.y<-40)this.dead=true;}};}

function q(delay,fn){spawnQ.push({at:qT+delay,fn});}
function spawnGroup(){
  const r=Math.random();
  if(r<.3){const x0=rnd(70,W-70);for(let i=0;i<5;i++)q(i*.35,()=>enemies.push(fairy(Math.max(40,Math.min(W-40,x0)),-20)));}
  else if(r<.55){const dir=Math.random()<.5?1:-1,y=rnd(70,160);for(let i=0;i<6;i++)q(i*.4,()=>enemies.push(wing(dir,y)));}
  else if(r<.8){q(0,()=>enemies.push(spinner(120)));q(.4,()=>enemies.push(spinner(W-120)));}
  else{q(0,()=>enemies.push(ringE(rnd(110,W-110))));q(1,()=>enemies.push(fairy(70,-20)));q(1,()=>enemies.push(fairy(W-70,-20)));}
}

/* ---------- 보스 ---------- */
function spawnBoss(){
  const hp=520+level*0+d*160;
  boss={x:W/2,y:-70,hp,max:hp,phase:0,t:0,mode:'enter',inv:1.2,c1:1,c2:1,c3:1,ang:0,r:34};
  showBanner('BOSS',2,'#ff4d6d');
}
function bossFire(dt){
  const b=boss;b.c1-=dt;b.c2-=dt;b.c3-=dt;
  if(b.phase===0){
    if(b.c1<=0){b.c1=1.5;const n=18+d*2,off=rnd(0,TAU);for(let i=0;i<n;i++)eb(b.x,b.y,off+i/n*TAU,110,'c');}
    if(b.c2<=0){b.c2=.55;const a=aim(b.x,b.y);for(let i=-3;i<=3;i++)eb(b.x,b.y,a+i*.14,170,'a');}
  }else if(b.phase===1){
    if(b.c1<=0){b.c1=.07;b.ang+=.33;const arms=d>=2?4:2;
      for(let i=0;i<arms;i++)eb(b.x,b.y,b.ang+i*TAU/arms,140,'b');}
    if(b.c2<=0){b.c2=2.2;const n=24,off=rnd(0,TAU);for(let i=0;i<n;i++)eb(b.x,b.y,off+i/n*TAU,90,'d');}
  }else{
    if(b.c1<=0){b.c1=.1;b.ang+=.27;eb(b.x,b.y,b.ang,150,'a');eb(b.x,b.y,-b.ang*1.3+PI,130,'b');}
    if(b.c2<=0){b.c2=.22;eb(rnd(10,W-10),-10,PI/2+rnd(-.1,.1),rnd(150,210),'c');}
    if(b.c3<=0){b.c3=2.8;const n=40,off=rnd(0,TAU);for(let i=0;i<n;i++)eb(b.x,b.y,off+i/n*TAU,i%2?130:90,'d');}
  }
}
function defeatBoss(){
  const b=boss;
  burst(b.x,b.y,'#ffd34d',90,300,1.2,4);burst(b.x,b.y,'#ff4d6d',60,220,1,4);
  snd(220,.8,'sawtooth',.06,-170);shake=.6;
  score+=10000*level;
  for(const e of enemies)burst(e.x,e.y,e.col,12);
  enemies=[];spawnQ=[];
  clearBullets(true);
  for(let i=0;i<10;i++)dropItem(b.x+rnd(-50,50),b.y+rnd(-30,30),i<4?'p':'s');
  boss=null;level++;d=level-1;diffSpd=Math.min(1.5,1+.06*d);
  stageT=0;spawnT=2.5;warn=false;
  if(p.lives<5)p.lives++;if(p.bombs<5)p.bombs++;
  showBanner('STAGE '+level,2.5,'#9ad0ff');
}
function clearBullets(toScore){
  for(const b of eb_){
    if(toScore){score+=5;if(Math.random()<.25)dropItem(b.x,b.y,'s');}
    if(parts.length<700&&Math.random()<.4)burst(b.x,b.y,'#ffffff',1,40,.3,2);
  }
  eb_.length=0;
}

/* ---------- 폭탄 / 사망 ---------- */
function bomb(){
  if(p.bombs<=0||bombT>0)return;
  p.bombs--;bombT=1.5;p.inv=Math.max(p.inv,2.2);
  bombFx={x:p.x,y:p.y,t:0};shake=.3;
  snd(160,.7,'sawtooth',.06,500);
}
function die(){
  p.lives--;
  burst(p.x,p.y,'#9ad0ff',40,260,.9,3);snd(300,.5,'sawtooth',.06,-260);shake=.5;
  clearBullets(false);
  p.power=Math.max(0,p.power-1);p.bombs=Math.max(p.bombs,3);
  p.x=W/2;p.y=H-90;p.inv=2.5;
  if(p.lives<=0){endGame();}
}

/* ---------- 업데이트 ---------- */
function update(dt){
  gT+=dt;
  for(const s of stars){s.y+=s.z*(state==='play'?70:30)*dt;if(s.y>H){s.y=0;s.x=rnd(0,W);}}
  if(state!=='play'||paused)return;

  /* 플레이어 */
  const focus=keys.ShiftLeft||keys.ShiftRight||touchFocus;
  let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  let dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  if(dx&&dy){dx*=.7071;dy*=.7071;}
  const sp=focus?170:340;
  p.x+=dx*sp*dt;p.y+=dy*sp*dt;clampP();
  if(p.inv>0)p.inv-=dt;
  p.fire-=dt;
  if(p.fire<=0){
    p.fire=.07;
    const lvl=Math.floor(p.power);
    const offs=[[0],[-8,8],[-12,0,12],[-16,-6,6,16],[-20,-10,0,10,20]][Math.min(4,lvl)];
    for(const o of offs)pb.push({x:p.x+o,y:p.y-12,vx:focus?0:o*5,vy:-720});
  }
  for(let i=pb.length-1;i>=0;i--){
    const b=pb[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-20||b.x<-20||b.x>W+20){pb[i]=pb[pb.length-1];pb.pop();}
  }

  /* 폭탄 */
  if(bombT>0){
    bombT-=dt;
    if(bombFx)bombFx.t+=dt;
    for(let i=eb_.length-1;i>=0;i--){
      const b=eb_[i];score+=5;
      if(Math.random()<.2)dropItem(b.x,b.y,'s');
      eb_[i]=eb_[eb_.length-1];eb_.pop();
    }
    for(const e of enemies)e.hp-=40*dt;
    if(boss&&boss.inv<=0&&boss.mode==='fight')boss.hp-=45*dt;
  }

  /* 스테이지 진행 */
  qT+=dt;
  for(let i=spawnQ.length-1;i>=0;i--){if(qT>=spawnQ[i].at){spawnQ[i].fn();spawnQ.splice(i,1);}}
  if(!boss&&!warn){
    stageT+=dt;spawnT-=dt;
    if(spawnT<=0){spawnGroup();spawnT=Math.max(1.7,3.2-.2*d)+rnd(0,.8);}
    if(stageT>=42){warn=true;warnT=2.5;showBanner('WARNING',2.5,'#ff4d6d');snd(120,.6,'sawtooth',.05,60);}
  }else if(warn&&!boss){
    warnT-=dt;if(warnT<=0)spawnBoss();
  }

  /* 적 */
  for(const e of enemies){
    e.upd(dt);
    for(let i=pb.length-1;i>=0;i--){
      const b=pb[i],ddx=b.x-e.x,ddy=b.y-e.y;
      if(ddx*ddx+ddy*ddy<(e.r+4)*(e.r+4)){e.hp-=1;pb[i]=pb[pb.length-1];pb.pop();burst(b.x,b.y,'#9ad0ff',1,60,.2,2);}
    }
    if(e.hp<=0&&!e.dead){
      e.dead=true;score+=e.sc;burst(e.x,e.y,e.col,16,170,.7,3);snd(520,.12,'square',.03,-300);
      if(Math.random()<.4)dropItem(e.x,e.y,'p');else if(Math.random()<.7)dropItem(e.x,e.y,'s');
    }
  }
  enemies=enemies.filter(e=>!e.dead);

  /* 보스 */
  if(boss){
    const b=boss;b.t+=dt;if(b.inv>0)b.inv-=dt;
    if(b.mode==='enter'){b.y+=90*dt;if(b.y>=110){b.y=110;b.mode='fight';b.inv=1;}}
    else{
      b.x=W/2+Math.sin(b.t*.6)*140;b.y=110+Math.sin(b.t*.9)*20;
      if(b.inv<=0)bossFire(dt);
      for(let i=pb.length-1;i>=0;i--){
        const q_=pb[i],ddx=q_.x-b.x,ddy=q_.y-b.y;
        if(ddx*ddx+ddy*ddy<(b.r+4)*(b.r+4)){
          if(b.inv<=0){b.hp-=1;score+=2;}
          pb[i]=pb[pb.length-1];pb.pop();burst(q_.x,q_.y,'#ffd34d',1,60,.2,2);
        }
      }
      const ratio=b.hp/b.max,np=ratio>.66?0:ratio>.33?1:2;
      if(np>b.phase){
        b.phase=np;b.inv=1.4;clearBullets(true);burst(b.x,b.y,'#ffffff',50,260,.9,3);
        snd(200,.5,'sawtooth',.05,300);shake=.3;showBanner('PHASE '+(np+1),1.5,'#ffd34d');
        b.c1=b.c2=b.c3=.8;
      }
      if(b.hp<=0)defeatBoss();
    }
  }

  /* 적 탄 + 충돌 */
  const hr=2.2;
  for(let i=eb_.length-1;i>=0;i--){
    const b=eb_[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){eb_[i]=eb_[eb_.length-1];eb_.pop();continue;}
    const ddx=b.x-p.x,ddy=b.y-p.y,d2=ddx*ddx+ddy*ddy;
    if(!b.g&&d2<(b.r+16)*(b.r+16)&&p.inv<=0){b.g=true;graze++;score+=20;snd(900,.04,'sine',.015);burst(p.x,p.y,'#fff',1,50,.2,1.5);}
    const hb=b.r*.8+hr;
    if(d2<hb*hb&&p.inv<=0){die();break;}
  }
  if(p.inv<=0){
    for(const e of enemies){const ddx=e.x-p.x,ddy=e.y-p.y;if(ddx*ddx+ddy*ddy<(e.r+hr)*(e.r+hr)){die();break;}}
  }

  /* 아이템 */
  for(let i=items.length-1;i>=0;i--){
    const it=items[i],ddx=p.x-it.x,ddy=p.y-it.y,dist=Math.hypot(ddx,ddy);
    if(dist<80||p.y<150){it.x+=ddx/dist*420*dt;it.y+=ddy/dist*420*dt;}
    else{it.vy=Math.min(120,it.vy+300*dt);it.y+=it.vy*dt;}
    if(dist<18){
      if(it.type==='p'){p.power=Math.min(4,p.power+.2);score+=50;}else score+=100;
      snd(1000,.05,'sine',.02);items.splice(i,1);continue;
    }
    if(it.y>H+20)items.splice(i,1);
  }

  /* 파티클 */
  for(let i=parts.length-1;i>=0;i--){
    const a=parts[i];a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.98;a.vy*=.98;a.life-=dt;
    if(a.life<=0){parts[i]=parts[parts.length-1];parts.pop();}
  }
  if(bombFx&&bombFx.t>1.2)bombFx=null;
  if(banner&&banner.t>0)banner.t-=dt;
  if(shake>0)shake-=dt;
}

/* ---------- 그리기 ---------- */
function text(s,x,y,size,col,align='center',bold=true){
  ctx.font=(bold?'700 ':'400 ')+size+'px '+FONT;ctx.textAlign=align;ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  const hue=(230+level*25)%360;
  g.addColorStop(0,`hsl(${hue},55%,7%)`);g.addColorStop(1,`hsl(${hue+40},60%,13%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.25+s.z*.35;ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.z*1.4,s.z*1.4+s.z);}
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const focus=keys.ShiftLeft||keys.ShiftRight||touchFocus;
  if(p.inv>0&&Math.floor(gT*14)%2===0)ctx.globalAlpha=.35;
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='#4dd2ff';
  ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(11,12);ctx.lineTo(0,6);ctx.lineTo(-11,12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(4,6);ctx.lineTo(-4,6);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff9d4d';ctx.globalAlpha*=.8;
  ctx.beginPath();ctx.moveTo(-4,8);ctx.lineTo(0,14+Math.sin(gT*40)*3);ctx.lineTo(4,8);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
  if(focus){ctx.strokeStyle='#ffffff55';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,16,0,TAU);ctx.stroke();}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,3,0,TAU);ctx.fill();
  ctx.strokeStyle='#ff4d6d';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,3.4,0,TAU);ctx.stroke();
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  const g=ctx.createRadialGradient(0,0,2,0,0,e.r+8);
  g.addColorStop(0,e.col);g.addColorStop(1,e.col+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,e.r+8,0,TAU);ctx.fill();
  ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,e.r*.45,0,TAU);ctx.fill();
  ctx.strokeStyle='#ffffffaa';ctx.lineWidth=2;ctx.rotate(gT*2);
  ctx.beginPath();ctx.arc(0,0,e.r+3,0,PI*1.2);ctx.stroke();
  ctx.restore();
}
function drawBoss(){
  const b=boss;ctx.save();ctx.translate(b.x,b.y);
  if(b.inv>0&&Math.floor(gT*16)%2===0)ctx.globalAlpha=.5;
  const cols=['#ff4d6d','#c77dff','#ffd34d'],col=cols[b.phase];
  const g=ctx.createRadialGradient(0,0,10,0,0,b.r+22);
  g.addColorStop(0,col+'cc');g.addColorStop(1,col+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,b.r+22,0,TAU);ctx.fill();
  ctx.fillStyle='#1a1030';ctx.strokeStyle=col;ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,b.r,0,TAU);ctx.fill();ctx.stroke();
  for(let i=0;i<3;i++){
    ctx.save();ctx.rotate(gT*(i%2?-1:1)*(1+i*.4)+i);ctx.strokeStyle=col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,b.r+8+i*7,0,PI*.7);ctx.stroke();ctx.restore();
  }
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,10,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,4,0,TAU);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;
}
function draw(){
  ctx.save();
  if(shake>0&&state==='play'&&!paused)ctx.translate(rnd(-4,4)*shake*2,rnd(-4,4)*shake*2);
  drawBg();

  if(state==='title'){
    text('별빛 탄막',W/2,200,54,'#fff');
    ctx.shadowColor='#4dd2ff';ctx.shadowBlur=20;text('STARLIGHT DANMAKU',W/2,235,18,'#4dd2ff');ctx.shadowBlur=0;
    const lines=['이동  방향키 / WASD  (터치: 드래그)','집중(저속·히트박스 표시)  Shift','폭탄  X 또는 Space','일시정지  P   재시작  R   음소거  M','자동 연사 · 아이템으로 파워업'];
    lines.forEach((l,i)=>text(l,W/2,320+i*28,16,'#b8c4ff','center',false));
    if(Math.floor(gT*2)%2===0)text('클릭 / Enter 로 시작',W/2,520,22,'#ffd34d');
    if(hi)text('HI '+String(hi).padStart(8,'0'),W/2,570,16,'#9aa',  'center',false);
    ctx.restore();return;
  }

  /* 플레이어 탄 */
  ctx.fillStyle='#bfefff';
  for(const b of pb)ctx.fillRect(b.x-1.5,b.y-8,3,14);
  /* 아이템 */
  for(const it of items){
    if(it.type==='p'){ctx.fillStyle='#ff4d6d';ctx.fillRect(it.x-6,it.y-6,12,12);text('P',it.x,it.y+4,10,'#fff');}
    else{ctx.fillStyle='#4dd2ff';ctx.save();ctx.translate(it.x,it.y);ctx.rotate(PI/4);ctx.fillRect(-4.5,-4.5,9,9);ctx.restore();}
  }
  for(const e of enemies)drawEnemy(e);
  if(boss)drawBoss();
  if(state==='play'||state==='over')if(p.lives>0)drawPlayer();

  /* 적 탄 */
  for(const b of eb_)ctx.drawImage(b.spr.c,b.x-b.spr.h,b.y-b.spr.h,b.spr.s,b.spr.s);
  /* 파티클 */
  for(const a of parts){ctx.globalAlpha=Math.max(0,a.life/a.max);ctx.fillStyle=a.col;ctx.fillRect(a.x-a.size/2,a.y-a.size/2,a.size,a.size);}
  ctx.globalAlpha=1;

  /* 폭탄 이펙트 */
  if(bombFx){
    const r=bombFx.t*650,al=Math.max(0,1-bombFx.t/1.2);
    ctx.globalAlpha=al*.5;ctx.fillStyle='#9ad0ff';ctx.beginPath();ctx.arc(bombFx.x,bombFx.y,r,0,TAU);ctx.fill();
    ctx.globalAlpha=al;ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();ctx.globalAlpha=1;
  }

  /* HUD */
  ctx.fillStyle='#00000088';ctx.fillRect(0,0,W,48);
  text('SCORE '+String(score).padStart(8,'0'),10,19,16,'#fff','left');
  text('HI '+String(Math.max(hi,score)).padStart(8,'0'),W-10,19,14,'#9aa','right');
  text('♥'.repeat(Math.max(0,p.lives)),10,40,16,'#ff4d6d','left');
  text('★'.repeat(p.bombs),10+Math.max(0,p.lives)*16+10,40,16,'#ffd34d','left');
  text('POWER '+p.power.toFixed(1),W/2+10,40,13,'#ff9db0','center');
  text('GRAZE '+graze,W-10,40,13,'#4dd2ff','right');
  text('STAGE '+level,W/2+10,19,13,'#9ad0ff','center');
  if(muted)text('MUTE',W-10,62,11,'#888','right');

  /* 보스 체력바 */
  if(boss){
    const bw=W-40,r=Math.max(0,boss.hp/boss.max);
    ctx.fillStyle='#00000099';ctx.fillRect(20,54,bw,8);
    ctx.fillStyle=['#ff4d6d','#c77dff','#ffd34d'][boss.phase];ctx.fillRect(20,54,bw*r,8);
    ctx.strokeStyle='#fff8';ctx.lineWidth=1;ctx.strokeRect(20,54,bw,8);
    ctx.fillStyle='#fff6';ctx.fillRect(20+bw*.33,53,1,10);ctx.fillRect(20+bw*.66,53,1,10);
  }

  /* 배너 */
  if(banner&&banner.t>0){
    const a=Math.min(1,banner.t*2);ctx.globalAlpha=a;
    ctx.shadowColor=banner.col;ctx.shadowBlur=18;
    text(banner.text,W/2,H/2-60,banner.text==='WARNING'?44:38,banner.col);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }

  if(paused){
    ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);
    text('일시정지',W/2,H/2-10,40,'#fff');text('P 또는 클릭으로 계속',W/2,H/2+30,16,'#b8c4ff','center',false);
  }
  if(state==='over'){
    ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);
    text('GAME OVER',W/2,230,46,'#ff4d6d');
    text('SCORE '+String(score).padStart(8,'0'),W/2,290,24,'#fff');
    text(score>=hi&&score>0?'NEW RECORD!':'HI '+String(hi).padStart(8,'0'),W/2,324,18,'#ffd34d');
    text('STAGE '+level+'  ·  GRAZE '+graze,W/2,360,16,'#9ad0ff','center',false);
    if(Math.floor(gT*2)%2===0)text('클릭 / Enter 로 다시 시작',W/2,440,20,'#fff');
  }
  ctx.restore();
}

/* ---------- 메인 루프 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
// 타이틀 화면용 초기값
p={x:W/2,y:H-90,lives:3,bombs:3,power:0,inv:0,fire:0};
pb=[];eb_=[];enemies=[];items=[];parts=[];boss=null;spawnQ=[];
score=0;graze=0;level=1;d=0;diffSpd=1;banner=null;bombFx=null;shake=0;
requestAnimationFrame(loop);
})();
</script>
